name: Verify bundled wiggle-monitor

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  reproducible-helper:
    runs-on: ubuntu-24.04
    steps:
      - name: Check out reviewed source and committed helper
        uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2

      - name: Rebuild and verify exact byte equality
        run: ./scripts/verify-wiggle-monitor
